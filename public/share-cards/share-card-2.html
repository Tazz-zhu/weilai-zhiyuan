<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>未来致远 · 分享卡2 功能</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    html, body { margin: 0; padding: 0; }
    body {
      width: 1080px; height: 1350px; overflow: hidden;
      font-family: var(--font); color: var(--text);
      background:
        radial-gradient(720px 420px at 92% -6%, rgba(255,140,66,.12), transparent 60%),
        radial-gradient(720px 420px at -6% 108%, rgba(74,163,194,.12), transparent 60%),
        #f7f4ef;
      position: relative;
    }
    .wrap { padding: 78px 72px 0; height: 1350px; box-sizing: border-box; display: flex; flex-direction: column; }
    .brand { display: flex; align-items: center; gap: 14px; }
    .brand-logo { width: 54px; height: 54px; border-radius: 17px; font-size: 28px; }
    .brand-name { font-size: 28px; font-weight: 900; color: var(--deep); letter-spacing: 2px; }
    .brand-name small { font-size: 14px; letter-spacing: 5px; color: var(--text-3); font-weight: 600; }
    .head { margin-top: 64px; text-align: center; }
    .head .eyebrow { font-size: 22px; letter-spacing: 8px; color: var(--primary-strong); font-weight: 800; }
    .head h1 { font-size: 66px; font-weight: 900; color: var(--deep); margin: 22px 0 0; line-height: 1.25; letter-spacing: 2px; }
    .head h1 .hl { color: var(--primary-strong); }
    .head p { margin-top: 20px; font-size: 24px; color: var(--text-2); letter-spacing: 3px; }
    .modules { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 22px; margin-top: 58px; }
    .mod {
      background: #fff; border: 1px solid var(--line); border-radius: 24px; padding: 34px 26px;
      box-shadow: var(--shadow-sm); text-align: center; position: relative; overflow: hidden;
    }
    .mod::before { content: ""; position: absolute; right: -30px; top: -30px; width: 110px; height: 110px; border-radius: 50%; background: radial-gradient(circle, rgba(255,140,66,.12), transparent 70%); }
    .mod .ic { width: 84px; height: 84px; border-radius: 24px; display: grid; place-items: center; font-size: 44px; margin: 0 auto 22px; }
    .mod h3 { font-size: 30px; font-weight: 900; color: var(--deep); margin-bottom: 14px; }
    .mod p { font-size: 19px; color: var(--text-2); line-height: 1.7; }
    .mod .tagline { display: inline-block; margin-top: 18px; font-size: 16px; font-weight: 800; color: var(--primary-strong); background: var(--primary-soft); padding: 7px 18px; border-radius: 100px; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; margin-top: 52px; }
    .stat { background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 26px 10px; text-align: center; box-shadow: var(--shadow-xs); }
    .stat .num { font-size: 42px; font-weight: 900; background: var(--grad-brand); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .stat .label { font-size: 18px; color: var(--text-2); margin-top: 6px; font-weight: 600; }
    .slogan { text-align: center; margin-top: 48px; padding: 22px 30px; border-radius: 20px; background: var(--grad-deep); color: #fff; }
    .slogan b { font-size: 30px; letter-spacing: 3px; }
    .slogan div { margin-top: 8px; font-size: 17px; color: rgba(255,255,255,.7); letter-spacing: 2px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <span class="brand-logo">🌅</span>
      <span class="brand-name">未来致远<small>你的人生，自己导航</small></span>
    </div>
    <div class="head">
      <div class="eyebrow">三个模块 · 完整闭环</div>
      <h1>别让未来，输在<br><span class="hl">“不知道”</span></h1>
      <p>从 18 岁到 60 岁，陪你把每一步都算数</p>
    </div>
    <div class="modules">
      <div class="mod">
        <div class="ic" style="background:var(--primary-soft)">👀</div>
        <h3>看见世界</h3>
        <p>180+ 职业一天vlog<br>四维雷达 · 真实人生剧本</p>
        <span class="tagline">职业认知馆</span>
      </div>
      <div class="mod">
        <div class="ic" style="background:var(--accent-soft)">🧭</div>
        <h3>找到方向</h3>
        <p>四维测评 · AI 路径拆解<br>高考志愿 · 冲稳保推荐</p>
        <span class="tagline">生涯规划师</span>
      </div>
      <div class="mod">
        <div class="ic" style="background:var(--teal-soft)">📖</div>
        <h3>留下足迹</h3>
        <p>成长时光轴 · 时光胶囊<br>年度人生白皮书</p>
        <span class="tagline">人生回忆录</span>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><div class="num">180+</div><div class="label">职业体验</div></div>
      <div class="stat"><div class="num">23</div><div class="label">大行业</div></div>
      <div class="stat"><div class="num">65</div><div class="label">高校志愿</div></div>
      <div class="stat"><div class="num">15</div><div class="label">行业导师</div></div>
    </div>
    <div class="slogan">
      <b>分数决定起点，你决定终点</b>
      <div>未来致远 · 职业认知 · 生涯规划 · 人生记录</div>
    </div>
  </div>
</body>
</html>
